name: Apply anatomy occlusion, outline AA, and brain colour

on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-anatomy-occlusion-aa-brain-color.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Apply source edits
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/edit.py <<'PY'
          from pathlib import Path

          def replace1(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'{label} not found')
              return s.replace(old, new, 1)

          p = Path('comic/web/scene/passes.js')
          s = p.read_text()
          anchor = """export function makePlainDepthMaterial(side = THREE.DoubleSide) {
              return new THREE.ShaderMaterial({
                  vertexShader: depthVert, fragmentShader: depthFrag, side,
                  uniforms: sliceUniforms(),
              });
          }
          """
          hard = anchor + """
          /** Negative depth marks geometry that must always occlude a nearer line. */
          export function makeHardOccluderDepthMaterial(side = THREE.DoubleSide) {
              return new THREE.ShaderMaterial({
                  vertexShader: depthVert,
                  fragmentShader: `varying float vDepth;\n${SLICE_FRAG_PARS}\nvoid main(){ if (gbSliceDiscard(vWorldPos)) discard; gl_FragColor = vec4(-vDepth/500.,1.,0.,1.); }`,
                  side,
                  uniforms: sliceUniforms(),
              });
          }
          """
          s = replace1(s, anchor, hard, 'plain depth material')
          s = replace1(s,
              "float s = max(smoothstep(uThreshold*0.96,uThreshold,edge), smoothstep(uThreshold,uThreshold*1.08,edge2));",
              """float aa1 = max(fwidth(edge) * 0.75, uThreshold * 0.01);
              float aa2 = max(fwidth(edge2) * 0.75, uThreshold * 0.01);
              float s = max(smoothstep(uThreshold-aa1,uThreshold+aa1,edge), smoothstep(uThreshold-aa2,uThreshold+aa2,edge2));""",
              'outline strength')
          p.write_text(s)

          p = Path('comic/web/scene/renderer.js')
          s = p.read_text()
          s = replace1(s,
              "import { OutlinePass, makeThresholdDepthMaterial, makePlainDepthMaterial, DEPTH_CLEAR } from './passes.js';",
              "import { OutlinePass, makeThresholdDepthMaterial, makePlainDepthMaterial, makeHardOccluderDepthMaterial, DEPTH_CLEAR } from './passes.js';",
              'passes import')
          s = replace1(s,
              "const anatomyClipDepthMat = makePlainDepthMaterial(THREE.BackSide);",
              "const anatomyClipDepthMat = makeHardOccluderDepthMaterial(THREE.FrontSide);",
              'anatomy clip material')
          s = replace1(s,
              "function renderClipDepth(camera, opaqueAnat, anyEdges, capActive) {",
              "function renderClipDepth(camera, anatomyOccluder, anyEdges, capActive) {",
              'renderClipDepth signature')
          # First opaqueAnat test after renderClipDepth is the depth-fold gate.
          i = s.index('function renderClipDepth(camera, anatomyOccluder')
          j = s.index('if (opaqueAnat) {', i)
          s = s[:j] + 'if (anatomyOccluder) {' + s[j+len('if (opaqueAnat) {'):]
          s = replace1(s,
              "const clip = anyEdges || opaqueAnat || capActive;",
              "const clip = anyEdges || showsAnatomy || capActive;",
              'clip condition')
          s = replace1(s,
              "if (clip) renderClipDepth(camera, opaqueAnat, anyEdges, capActive);",
              "if (clip) renderClipDepth(camera, showsAnatomy, anyEdges, capActive);",
              'clip call')
          s = replace1(s,
              "glassMat.uniforms.uMaxOpacity.value = s.glass.maxOpacity;",
              """glassMat.uniforms.uMaxOpacity.value = s.glass.maxOpacity;
              glassMat.uniforms.uColor.value.set(s.glass.color ?? '#ffffff');
              anatomyMat.uniforms.uColor.value.set(s.anatomy.color ?? s.glass.color ?? '#ffffff');
              anatomyOpaqueMat.uniforms.uColor.value.set(s.anatomy.opaqueColor ?? s.anatomy.color ?? s.glass.color ?? '#ffffff');""",
              'glass style')
          p.write_text(s)

          p = Path('comic/web/controls/bind.js')
          s = p.read_text()
          anchor = "slider('c-cortex', s.glass.maxOpacity, (v) => { s.glass.maxOpacity = v; apply(); }, { min: 0, max: 1.0, step: 0.01 });"
          s = replace1(s, anchor, anchor + """
              color('c-brain-color', s.glass.color ?? '#ffffff', (hex) => {
                  s.glass.color = hex;
                  s.anatomy.color = hex;
                  s.anatomy.opaqueColor = hex;
                  apply();
              });""", 'cortex alpha control')
          p.write_text(s)

          p = Path('comic/web/index.html')
          s = p.read_text()
          anchor = '<div class="sw"><span>cortex α</span><input type="range" id="c-cortex"></div>'
          s = replace1(s, anchor, anchor + '\n        <div class="sw" title="Anatomical background colour for cortex and subcortex"><span>brain</span><input type="color" class="swatch" id="c-brain-color"></div>', 'cortex alpha html')
          s = s.replace('<b>cortex α</b> glass opacity · <b>edge thr</b>', '<b>cortex α</b> glass opacity · <b>brain</b> cortex/subcortex background colour · <b>edge thr</b>', 1)
          s = s.replace('<b>vox α</b> line strength over voxels.', '<b>vox α</b> line strength over statistical voxels only.', 1)
          p.write_text(s)
          PY
          python /tmp/edit.py
      - name: Syntax and unit checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check comic/web/scene/passes.js
          node --check comic/web/scene/renderer.js
          node --check comic/web/controls/bind.js
          node --test comic/web/core/*.test.js
      - name: Commit source changes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-anatomy-occlusion-aa-brain-color.yml
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add -A
          git commit -m "fix: occlude cortex lines behind anatomy and smooth outlines"
          git push origin HEAD:main
