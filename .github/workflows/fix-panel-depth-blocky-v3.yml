name: Fix panel-relative depth cut and paired-view voxel representation

on:
  push:
    branches: [automation/fix-view-relative-depth-blocky-paired]
    paths: [".github/workflows/fix-panel-depth-blocky-v3.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/fix-view-relative-depth-blocky-paired
          fetch-depth: 0

      - name: Apply source edits
        run: python .github/scripts/fix_panel_depth_blocky_v3.py

      - name: Check and test
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check comic/web/scene/renderer.js
          node --check comic/web/core/framing.js
          node --check comic/web/core/views.js
          node --check comic/web/core/visibility.js
          node --test comic/web/core/*.test.js

      - name: Commit corrected implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-panel-depth-blocky-v3.yml
          git rm .github/scripts/fix_panel_depth_blocky_v3.py
          git rm -f .github/workflows/apply-view-depth-blocky-fix.yml
          git rm -f .github/patches/view-depth-blocky.*
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add comic/web/core/views.js comic/web/core/visibility.js comic/web/core/framing.js \
                  comic/web/core/core.test.js comic/web/scene/renderer.js
          git commit -m "fix: make depth cut panel-relative and preserve blocky paired voxels"
          git push origin HEAD:automation/fix-view-relative-depth-blocky-paired
