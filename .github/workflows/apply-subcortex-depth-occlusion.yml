name: Apply subcortex depth occlusion fix

on:
  push:
    branches: [automation/fix-subcortex-depth-occlusion]
    paths: [".github/workflows/apply-subcortex-depth-occlusion.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/fix-subcortex-depth-occlusion
          fetch-depth: 0

      - name: Restore depth-correct cortex occlusion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("comic/web/scene/renderer.js")
          text = path.read_text()

          replacements = [
              (
                  """    cortexOutline.outlineMaterial.uniforms.uClipDepth.value = clipTarget.texture;\n    // Subcortical outlines are anatomical annotations. They deliberately remain legible through\n    // the glass cortex in paired lateral and medial views rather than being clipped by its depth.\n    // Voxel edges clip against the SAME combined depth, so an overlay's edges are\n""",
                  """    cortexOutline.outlineMaterial.uniforms.uClipDepth.value = clipTarget.texture;\n    // Subcortical lines clip against the cortex depth field. This preserves their independent\n    // anatomical outline while letting whichever surface is nearer to the camera occlude the other.\n    anatomyOutline.outlineMaterial.uniforms.uClipDepth.value = cortexOutline.depthTarget.texture;\n    // Voxel edges clip against the SAME combined depth, so an overlay's edges are\n""",
              ),
              (
                  """                    // Subcortical anatomy is intentionally legible through the glass cortex.\n                    au.uClipApply.value = 0.0;\n                    au.uOverVoxelAlpha.value = 1.0;\n""",
                  """                    // The cortex depth target was rendered immediately above. Hide this line\n                    // only where cortex is genuinely nearer; keep it where subcortex is in front.\n                    au.uClipApply.value = 1.0;\n                    au.uOverVoxelAlpha.value = 0.0;\n""",
              ),
              (
                  """            // Separately styled silhouettes run once per anatomical group, last. Cortex remains\n            // depth-correct against opaque anatomy/voxels/caps; the subcortex contour is an\n            // annotation and stays visible through the transparent cortical shell.\n""",
                  """            // Separately styled silhouettes run once per anatomical group, last. Each contour\n            // retains its own depth field, and the cortex depth-clips the subcortex wherever it\n            // is nearer to the camera.\n""",
              ),
              (
                  """                    au.uClipApply.value = 0.0;\n                    au.uOverVoxelAlpha.value = 1.0;\n                    au.uBgMode.value = 2.0;\n""",
                  """                    au.uClipApply.value = 1.0;\n                    au.uOverVoxelAlpha.value = 0.0;\n                    au.uBgMode.value = 2.0;\n""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git diff --check
          node --check comic/web/scene/renderer.js
          node --test comic/web/core/*.test.js

          grep -Fq "anatomyOutline.outlineMaterial.uniforms.uClipDepth.value = cortexOutline.depthTarget.texture" comic/web/scene/renderer.js
          test "$(grep -Fc 'au.uClipApply.value = 1.0;' comic/web/scene/renderer.js)" -eq 2
          test "$(grep -Fc 'au.uOverVoxelAlpha.value = 0.0;' comic/web/scene/renderer.js)" -eq 2

      - name: Commit fix to branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-subcortex-depth-occlusion.yml
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add comic/web/scene/renderer.js
          git commit -m "fix: depth-occlude subcortex outlines behind cortex"
          git push origin HEAD:automation/fix-subcortex-depth-occlusion
