name: Apply searchable colormap picker

on:
  push:
    branches: [automation/searchable-colormaps]
    paths: [".github/workflows/apply-searchable-colormaps.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/searchable-colormaps
      - name: Patch picker and styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('comic/web/controls/cmap-picker.js')
          s = p.read_text()
          old = """        pop = document.createElement('div'); pop.className = 'cmap-popup'; pop.setAttribute('role', 'listbox');
        let cat = null;
        for (const it of items) {
            if (it.cat !== cat) { cat = it.cat; const h = document.createElement('div'); h.className = 'cmap-cat'; h.textContent = cat; pop.appendChild(h); }
            const row = document.createElement('button'); row.type = 'button'; row.className = 'cmap-item' + (it.name === cur ? ' sel' : ''); row.dataset.name = it.name;
            const sw = document.createElement('canvas'); sw.className = 'cmap-swatch'; drawSwatch(sw, colormaps.get(it.name), it.name);
            const nm = document.createElement('span'); nm.className = 'cmap-name'; nm.textContent = it.name;
            row.append(sw, nm);
            row.addEventListener('click', () => { setValue(it.name, true); close(); });
            pop.appendChild(row);
        }
        document.body.appendChild(pop);
"""
          new = """        pop = document.createElement('div'); pop.className = 'cmap-popup'; pop.setAttribute('role', 'listbox');

        const search = document.createElement('input');
        search.type = 'search';
        search.className = 'cmap-search';
        search.placeholder = 'Search colormaps…';
        search.setAttribute('aria-label', 'Search colormaps');
        search.autocomplete = 'off';
        pop.appendChild(search);

        let cat = null;
        const categoryHeaders = new Map();
        for (const it of items) {
            if (it.cat !== cat) {
                cat = it.cat;
                const h = document.createElement('div'); h.className = 'cmap-cat'; h.textContent = cat;
                categoryHeaders.set(cat, h);
                pop.appendChild(h);
            }
            const row = document.createElement('button'); row.type = 'button'; row.className = 'cmap-item' + (it.name === cur ? ' sel' : ''); row.dataset.name = it.name; row.dataset.category = it.cat;
            const sw = document.createElement('canvas'); sw.className = 'cmap-swatch'; drawSwatch(sw, colormaps.get(it.name), it.name);
            const nm = document.createElement('span'); nm.className = 'cmap-name'; nm.textContent = it.name;
            row.append(sw, nm);
            row.addEventListener('click', () => { setValue(it.name, true); close(); });
            pop.appendChild(row);
        }

        const filter = () => {
            const q = search.value.trim().toLowerCase();
            const visibleCats = new Set();
            for (const row of pop.querySelectorAll('.cmap-item')) {
                const hit = !q || row.dataset.name.toLowerCase().includes(q) || row.dataset.category.toLowerCase().includes(q);
                row.hidden = !hit;
                if (hit) visibleCats.add(row.dataset.category);
            }
            for (const [name, h] of categoryHeaders) h.hidden = !visibleCats.has(name);
        };
        search.addEventListener('input', filter);
        search.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { e.preventDefault(); close(); trigger.focus(); }
            else if (e.key === 'Enter') {
                const first = [...pop.querySelectorAll('.cmap-item')].find((row) => !row.hidden);
                if (first) { e.preventDefault(); first.click(); }
            } else if (e.key === 'ArrowDown') {
                const first = [...pop.querySelectorAll('.cmap-item')].find((row) => !row.hidden);
                if (first) { e.preventDefault(); first.focus(); }
            }
        });

        document.body.appendChild(pop);
"""
          if old not in s:
              raise SystemExit('picker patch anchor not found')
          s = s.replace(old, new, 1)
          old2 = """        pop.querySelector('.cmap-item.sel')?.scrollIntoView({ block: 'nearest' });
        trigger.setAttribute('aria-expanded', 'true');
        setTimeout(() => document.addEventListener('click', onDoc, true), 0);
"""
          new2 = """        pop.querySelector('.cmap-item.sel')?.scrollIntoView({ block: 'nearest' });
        trigger.setAttribute('aria-expanded', 'true');
        search.focus();
        search.select();
        setTimeout(() => document.addEventListener('click', onDoc, true), 0);
"""
          if old2 not in s:
              raise SystemExit('focus patch anchor not found')
          p.write_text(s.replace(old2, new2, 1))

          p = Path('comic/web/index.html')
          s = p.read_text()
          old = """    .cmap-popup { position: fixed; z-index: 50; width: 210px; max-height: 340px; overflow-y: auto;
      background: #fff; border: 1px solid #bbb; border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      padding: 4px; scrollbar-width: thin; }
    .cmap-popup .cmap-cat { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.04em; padding: 5px 6px 2px; }
"""
          new = """    .cmap-popup { position: fixed; z-index: 50; width: 230px; max-height: 340px; overflow-y: auto;
      background: #fff; border: 1px solid #bbb; border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      padding: 4px; scrollbar-width: thin; }
    .cmap-search { position: sticky; top: 0; z-index: 2; width: 100%; height: 28px; padding: 4px 8px;
      border: 1px solid #bbb; border-radius: 4px; background: #fff; color: #333; font-size: 11px; outline: none; }
    .cmap-search:focus { border-color: #4a90d9; box-shadow: 0 0 0 2px rgba(74,144,217,0.14); }
    .cmap-popup .cmap-cat { font-size: 10px; color: #999; text-transform: uppercase; letter-spacing: 0.04em; padding: 5px 6px 2px; }
"""
          if old not in s:
              raise SystemExit('css patch anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Check
        shell: bash
        run: |
          node --check comic/web/controls/cmap-picker.js
          node --test comic/web/core/*.test.js
          git diff --check

      - name: Commit
        shell: bash
        run: |
          git rm .github/workflows/apply-searchable-colormaps.yml
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add comic/web/controls/cmap-picker.js comic/web/index.html
          git commit -m "feat: make colormap picker searchable"
          git push origin HEAD:automation/searchable-colormaps
