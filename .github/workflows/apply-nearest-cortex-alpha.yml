name: Apply nearest-surface cortex alpha

on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-nearest-cortex-alpha.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Apply renderer changes
        run: python .github/apply_nearest_cortex_alpha.py
      - name: Syntax and unit checks
        run: |
          set -euo pipefail
          git diff --check
          node --check comic/web/scene/materials.js
          node --check comic/web/scene/renderer.js
          node --check comic/web/controls/bind.js
          node --test comic/web/core/*.test.js
      - name: Commit source changes and self-remove
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-nearest-cortex-alpha.yml .github/apply_nearest_cortex_alpha.py
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add -A
          git commit -m "feat: resolve cortex alpha on nearest surface"
          git push origin HEAD:main
