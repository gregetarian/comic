name: Cleanup searchable colormap branch

on:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-searchable-colormaps.yml"]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Delete merged branch and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete automation/searchable-colormaps || true
          git rm .github/workflows/cleanup-searchable-colormaps.yml
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git commit -m "chore: remove searchable-colormap cleanup workflow"
          git push origin HEAD:main
