name: Apply signed paired-view fix

on:
  push:
    branches: [automation/fix-signed-paired-subcortex]
    paths:
      - ".github/workflows/apply-signed-paired-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/fix-signed-paired-subcortex
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/patches/signed-paired-fix.aa \
            .github/patches/signed-paired-fix.ab \
            .github/patches/signed-paired-fix.ac \
            .github/patches/signed-paired-fix.ad \
            .github/patches/signed-paired-fix.ae \
            .github/patches/signed-paired-fix.af \
            .github/patches/signed-paired-fix.ag \
            .github/patches/signed-paired-fix.ah0 \
            .github/patches/signed-paired-fix.ah1 \
            .github/patches/signed-paired-fix.ah2 \
            .github/patches/signed-paired-fix.ah3 \
            .github/patches/signed-paired-fix.ai \
            .github/patches/signed-paired-fix.aj \
            | base64 -d > /tmp/fix.patch
          test "$(wc -c < /tmp/fix.patch)" -eq 23686
          echo "03760bd292114c4f6bf2da883992eb4b7959aeafbaa61beed7f3c90ff02d951d  /tmp/fix.patch" | sha256sum -c -
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch

      - name: Check and test
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check comic/web/app/main.js
          node --check comic/web/controls/freecanvas.js
          node --check comic/web/core/views.js
          node --test comic/web/core/*.test.js
          python -m py_compile comic/render.py tests/test_surface.py tests/integration_test.py

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-signed-paired-fix.yml
          git rm .github/patches/signed-paired-fix.*
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add comic/render.py comic/web/app/main.js comic/web/controls/bind.js \
                  comic/web/controls/freecanvas.js comic/web/core/config-schema.js \
                  comic/web/core/core.test.js comic/web/core/views.js \
                  comic/web/core/visibility.js tests/integration_test.py \
                  tests/test_surface.py
          git commit -m "fix: preserve signed cortex in paired subcortical views"
          git push origin HEAD:automation/fix-signed-paired-subcortex
