name: Optimise view-depth sampling

on:
  push:
    branches: [automation/fix-view-relative-depth-blocky-paired]
    paths: [".github/workflows/optimise-depth-sampling.yml"]

permissions:
  contents: write

jobs:
  optimise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: automation/fix-view-relative-depth-blocky-paired
          fetch-depth: 0

      - name: Apply optimisation
        run: python .github/scripts/optimise_depth_sampling.py

      - name: Check and test
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check comic/web/scene/renderer.js
          node --test comic/web/core/*.test.js

      - name: Commit optimisation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/optimise-depth-sampling.yml
          git rm .github/scripts/optimise_depth_sampling.py
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add comic/web/scene/renderer.js
          git commit -m "perf: keep voxel depth sampling strided"
          git push origin HEAD:automation/fix-view-relative-depth-blocky-paired
