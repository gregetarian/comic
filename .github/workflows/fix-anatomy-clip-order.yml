name: Fix anatomy clip declaration order

on:
  push:
    branches: [main]
    paths: [".github/workflows/fix-anatomy-clip-order.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Move anatomy visibility resolution before clipping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('comic/web/scene/renderer.js')
          s = p.read_text()
          decl = "            const showsAnatomy = (def.content?.roles || []).includes('anatomy');\n"
          if s.count(decl) != 1:
              raise SystemExit(f'expected one showsAnatomy declaration, found {s.count(decl)}')
          s = s.replace(decl, '', 1)
          anchor = "            let anyEdges = false;\n            for (let i = 0; i < N; i++) if (osR[i].edges.enabled) anyEdges = true;\n"
          if anchor not in s:
              raise SystemExit('edge anchor not found')
          s = s.replace(anchor, anchor + decl, 1)
          # Update stale comments and normalise the colour-uniform indentation.
          s = s.replace(
              "            // Clip when there are voxel edges OR an opaque subcortex (so edges + cortex lines\n            // behind the shell are occluded). Opaque-anatomy folds its depth into the target.\n",
              "            // Clip against statistical voxels when needed, and ALWAYS against visible subcortex.\n            // Anatomical occlusion is hard and does not inherit the vox-alpha stroke strength.\n", 1)
          s = s.replace(
              "        glassMat.uniforms.uMaxOpacity.value = s.glass.maxOpacity;\n    glassMat.uniforms.uColor.value.set(s.glass.color ?? '#ffffff');\n    anatomyMat.uniforms.uColor.value.set(s.anatomy.color ?? s.glass.color ?? '#ffffff');\n    anatomyOpaqueMat.uniforms.uColor.value.set(s.anatomy.opaqueColor ?? s.anatomy.color ?? s.glass.color ?? '#ffffff');\n",
              "        glassMat.uniforms.uMaxOpacity.value = s.glass.maxOpacity;\n        glassMat.uniforms.uColor.value.set(s.glass.color ?? '#ffffff');\n        anatomyMat.uniforms.uColor.value.set(s.anatomy.color ?? s.glass.color ?? '#ffffff');\n        anatomyOpaqueMat.uniforms.uColor.value.set(s.anatomy.opaqueColor ?? s.anatomy.color ?? s.glass.color ?? '#ffffff');\n", 1)
          p.write_text(s)
          PY
          git diff --check
          node --check comic/web/scene/renderer.js
      - name: Commit and self-remove
        shell: bash
        run: |
          git rm .github/workflows/fix-anatomy-clip-order.yml
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve anatomy visibility before outline clipping"
          git push origin HEAD:main
