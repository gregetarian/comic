name: Apply default display changes

on:
  push:
    branches: [automation/default-blocky-zero-voxel-alpha]
    paths: [".github/workflows/apply-default-display.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/default-blocky-zero-voxel-alpha
          fetch-depth: 0

      - name: Change defaults and guard them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          cfg_path = Path("comic/web/core/config-schema.js")
          cfg = cfg_path.read_text()
          cfg = replace_once(cfg, "representation: 'smooth', // 'blocky' (voxelwise) | 'smooth' | 'surface' (project onto the cortex, M8)", "representation: 'blocky', // 'blocky' (voxelwise) | 'smooth' | 'surface' (project onto the cortex, M8)", "representation default")
          cfg = replace_once(cfg, "        // the voxel it crosses (so the line reads as passing under the blob). Default false = the\n        // depth-correct look (voxels occlude the lines behind them).", "        // the voxel it crosses. The default is 0, so a nearer voxel fully hides the buried cortex line.", "over-voxel comment")
          cfg = replace_once(cfg, "overVoxels: true, overVoxelOpacity: 0.4, anatomyColor: null,", "overVoxels: true, overVoxelOpacity: 0.0, anatomyColor: null,", "over-voxel alpha default")
          cfg_path.write_text(cfg)

          test_path = Path("comic/web/core/core.test.js")
          tests = test_path.read_text()
          tests = replace_once(tests, "test('default display applies no intensity or cluster cutoff', () => {", "test('default display is blocky, depth-correct, and has no intensity or cluster cutoff', () => {", "default test title")
          tests = replace_once(tests, "    assert.equal(DEFAULTS.style.voxel.clusterMin, 0);", "    assert.equal(DEFAULTS.style.voxel.representation, 'blocky');\n    assert.equal(DEFAULTS.style.outline.overVoxelOpacity, 0);\n    assert.equal(DEFAULTS.style.voxel.clusterMin, 0);", "default assertions")
          tests = replace_once(tests, "    assert.equal(cfg.style.threshold, 0);\n    assert.equal(cfg.style.voxel.clusterMin, 0);", "    assert.equal(cfg.style.threshold, 0);\n    assert.equal(cfg.style.voxel.representation, 'blocky');\n    assert.equal(cfg.style.outline.overVoxelOpacity, 0);\n    assert.equal(cfg.style.voxel.clusterMin, 0);", "normalised assertions")
          test_path.write_text(tests)
          PY

          git diff --check
          node --check comic/web/core/config-schema.js
          node --test comic/web/core/*.test.js
          grep -Fq "representation: 'blocky'" comic/web/core/config-schema.js
          grep -Fq "overVoxelOpacity: 0.0" comic/web/core/config-schema.js

      - name: Commit change to branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-default-display.yml
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add comic/web/core/config-schema.js comic/web/core/core.test.js
          git commit -m "style: default to blocky voxels and zero over-voxel line alpha"
          git push origin HEAD:automation/default-blocky-zero-voxel-alpha
