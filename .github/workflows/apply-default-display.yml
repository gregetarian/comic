name: Apply default display changes

on:
  push:
    branches: [automation/default-blocky-zero-voxel-alpha]
    paths: [".github/workflows/apply-default-display.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/default-blocky-zero-voxel-alpha
          fetch-depth: 0

      - name: Change defaults and guard them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cfg_path = Path("comic/web/core/config-schema.js")
          cfg = cfg_path.read_text()
          replacements = [
              (
                  "representation: 'smooth', // 'blocky' (voxelwise) | 'smooth' | 'surface' (project onto the cortex, M8)",
                  "representation: 'blocky', // 'blocky' (voxelwise) | 'smooth' | 'surface' (project onto the cortex, M8)",
              ),
              (
                  """        // for the buried portion: 1 = full black on top, <1 = a muted/greyed stroke that blends with
        // the voxel it crosses (so the line reads as passing under the blob). Default false = the
        // depth-correct look (voxels occlude the lines behind them).
""",
                  """        // for the buried portion: 1 = full black on top, <1 = a muted/greyed stroke that blends with
        // the voxel it crosses. The default is 0, so a nearer voxel fully hides the buried cortex line.
""",
              ),
              (
                  "overVoxels: true, overVoxelOpacity: 0.4, anatomyColor: null,",
                  "overVoxels: true, overVoxelOpacity: 0.0, anatomyColor: null,",
              ),
          ]
          for old, new in replacements:
              count = cfg.count(old)
              if count != 1:
                  raise SystemExit(f"config replacement expected once, found {count}: {old[:90]!r}")
              cfg = cfg.replace(old, new, 1)
          cfg_path.write_text(cfg)

          test_path = Path("comic/web/core/core.test.js")
          tests = test_path.read_text()
          old = """test('default display applies no intensity or cluster cutoff', () => {
    assert.equal(DEFAULTS.style.voxel.clusterMin, 0);
    const cfg = normalizeConfig({
        style: { threshold: 0 },
        layout: { panels: [{ id: 'a', camera: { plane: 'dorsal' }, cell: { row: 0, col: 0 } }] },
    });
    assert.equal(cfg.style.threshold, 0);
    assert.equal(cfg.style.voxel.clusterMin, 0);
});
"""
          new = """test('default display is blocky, depth-correct, and has no intensity or cluster cutoff', () => {
    assert.equal(DEFAULTS.style.voxel.representation, 'blocky');
    assert.equal(DEFAULTS.style.outline.overVoxelOpacity, 0);
    assert.equal(DEFAULTS.style.voxel.clusterMin, 0);
    const cfg = normalizeConfig({
        style: { threshold: 0 },
        layout: { panels: [{ id: 'a', camera: { plane: 'dorsal' }, cell: { row: 0, col: 0 } }] },
    });
    assert.equal(cfg.style.threshold, 0);
    assert.equal(cfg.style.voxel.representation, 'blocky');
    assert.equal(cfg.style.outline.overVoxelOpacity, 0);
    assert.equal(cfg.style.voxel.clusterMin, 0);
});
"""
          count = tests.count(old)
          if count != 1:
              raise SystemExit(f"test replacement expected once, found {count}")
          test_path.write_text(tests.replace(old, new, 1))
          PY

          git diff --check
          node --check comic/web/core/config-schema.js
          node --test comic/web/core/*.test.js
          grep -Fq "representation: 'blocky'" comic/web/core/config-schema.js
          grep -Fq "overVoxelOpacity: 0.0" comic/web/core/config-schema.js

      - name: Commit change to branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-default-display.yml
          git config user.name "gregetarian"
          git config user.email "78038105+gregetarian@users.noreply.github.com"
          git add comic/web/core/config-schema.js comic/web/core/core.test.js
          git commit -m "style: default to blocky voxels and zero over-voxel line alpha"
          git push origin HEAD:automation/default-blocky-zero-voxel-alpha
